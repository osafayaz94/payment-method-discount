api_version = "2026-07"

[[extensions]]
name = "Payment discount amount"
handle = "thank-you-amount"
uid = "40e4c6ca-0e06-d52c-68f4-7b9b816ca278dd457906"
type = "ui_extension"

# Thank-you page blocks are available on every plan (the checkout steps
# themselves need Shopify Plus). Added at the top of the Thank-you page when a
# store installs the app; the merchant can move or remove it in the checkout
# editor.
[[extensions.targeting]]
module = "./src/ThankYou.jsx"
target = "purchase.thank-you.block.render"
default_placement = "ORDER_STATUS1"

# Written by the app whenever its settings are saved (app/settings.server.ts).
[[extensions.metafields]]
namespace = "$app:payment_discount"
key = "settings"
