# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "e51d1ea6a855ffacddfdaa9c8550e3e4"
name = "Nexora: Bank Transfer Discount"
# The Cloudflare Worker (see README, Deployment).
application_url = "https://payment-method-discount.osafayaz94.workers.dev"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,write_orders,write_order_edits,write_discounts,write_payment_customizations"

[auth]
redirect_urls = [
  "https://payment-method-discount.osafayaz94.workers.dev/auth/callback",
  "https://payment-method-discount.osafayaz94.workers.dev/api/auth"
]

[webhooks]
api_version = "2026-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Handled by: /app/routes/webhooks.orders.create.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]
  # The app re-reads the order itself, so it only needs the ID.
  include_fields = [ "admin_graphql_api_id" ]

  # Mandatory privacy webhooks. Handled by: /app/routes/webhooks.compliance.tsx
  # See: https://shopify.dev/docs/apps/build/privacy-law-compliance
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[build]
automatically_update_urls_on_dev = true
